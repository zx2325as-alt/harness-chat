<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Harness Chat</title>
    <style>
      html, body { height: 100%; margin: 0; background: #161b26; color: #e2e8f0; overflow: hidden; }
      html { color-scheme: dark; }
      /* 整体 UI 缩放到 85%，不改变内部相对布局（逻辑尺寸放大后 scale 回视口） */
      #app {
        width: calc(100vw / 0.85);
        height: calc(100vh / 0.85);
        transform: scale(0.85);
        transform-origin: top left;
      }
      * { box-sizing: border-box; }
      a { color: inherit; }
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #39465c #1a1f2b;
      }
      /* Chromium / Safari / Electron */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1f2b;
      }
      ::-webkit-scrollbar-thumb {
        background: #39465c;
        border-radius: 6px;
        border: 2px solid #1a1f2b;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5c78;
      }
      ::-webkit-scrollbar-corner {
        background: #1a1f2b;
      }
    </style>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能运行。</noscript>
    <div id="app"></div>
  </body>
</html>
